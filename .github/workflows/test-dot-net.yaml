name: test-dot-net

on:
  push:
    branches:
      - master
      - dot-net
  workflow_dispatch:

concurrency:
  group: test-dot-net-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-local:
    name: test-local-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-2022
            rid: win-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native lib
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            cmake -Bbuild \
              -DCMAKE_INSTALL_PREFIX=build/install \
              -DCMAKE_OSX_ARCHITECTURES="arm64" \
              -DBUILD_SHARED_LIBS=ON \
              -DBUILD_PIPER_PHONEMIZE_PYTHON=OFF \
              -DBUILD_PIPER_PHONEMIZE_CORE_TESTS=OFF
            cmake --build build -j$(sysctl -n hw.ncpu) --target install
            mkdir -p /tmp/dotnet/${{ matrix.rid }}
            cp build/install/lib/libpiper_phonemize_core.dylib /tmp/dotnet/${{ matrix.rid }}/
          elif [[ "${{ matrix.os }}" == windows-* ]]; then
            cmake -Bbuild \
              -DCMAKE_INSTALL_PREFIX=build/install \
              -DBUILD_SHARED_LIBS=ON \
              -DBUILD_PIPER_PHONEMIZE_PYTHON=OFF \
              -DBUILD_PIPER_PHONEMIZE_CORE_TESTS=OFF
            cmake --build build --config Release --target install
            mkdir -p /tmp/dotnet/${{ matrix.rid }}
            cp build/install/bin/piper_phonemize_core.dll /tmp/dotnet/${{ matrix.rid }}/
          else
            cmake -Bbuild \
              -DCMAKE_INSTALL_PREFIX=build/install \
              -DBUILD_SHARED_LIBS=ON \
              -DBUILD_PIPER_PHONEMIZE_PYTHON=OFF \
              -DBUILD_PIPER_PHONEMIZE_CORE_TESTS=OFF
            cmake --build build -j$(nproc) --target install
            mkdir -p /tmp/dotnet/${{ matrix.rid }}
            cp build/install/lib/libpiper_phonemize_core.so /tmp/dotnet/${{ matrix.rid }}/
          fi

      - name: Pack NuGet packages
        shell: bash
        run: |
          python3 -m pip install jinja2
          chmod +x scripts/dotnet/run.sh
          ./scripts/dotnet/run.sh

      - name: Run example with local packages
        shell: bash
        run: |
          cd dotnet-examples/PhonemizeText
          echo "=== Available local packages ==="
          ls /tmp/dotnet/packages/*.nupkg 2>&1
          dotnet add package com.github.csukuangfj.piper.phonemize \
            --source /tmp/dotnet/packages/ \
            --prerelease
          dotnet restore --source /tmp/dotnet/packages/
          echo "=== Package version ==="
          dotnet list package 2>&1
          echo "=== Building ==="
          dotnet build -v normal 2>&1 | tail -20
          echo "=== espeak-ng-data in output ==="
          find bin -name "phontab" 2>/dev/null || echo "NOT FOUND"
          echo "=== Native libs in output ==="
          find bin -name "libpiper_phonemize_core*" -o -name "piper_phonemize_core*" 2>/dev/null | head -5
          echo "=== Running ==="
          dotnet run

  test-published:
    name: test-published-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-22.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: windows-2022
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run example with published packages
        shell: bash
        run: |
          cd dotnet-examples/PhonemizeText
          echo "=== Restoring ==="
          dotnet restore -v normal 2>&1 | tail -20
          echo "=== Package version ==="
          dotnet list package 2>&1
          echo "=== Building ==="
          dotnet build -v normal 2>&1 | tail -20
          echo "=== espeak-ng-data in output ==="
          find bin -name "phontab" 2>/dev/null || echo "NOT FOUND"
          echo "=== Native libs in output ==="
          find bin -name "libpiper_phonemize_core*" -o -name "piper_phonemize_core*" 2>/dev/null | head -5
          echo "=== Running ==="
          dotnet run
