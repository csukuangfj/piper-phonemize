name: test-dot-net

on:
  push:
    branches:
      - master
      - dot-net
  workflow_dispatch:

concurrency:
  group: test-dot-net-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native lib
        shell: bash
        run: |
          cmake -Bbuild \
            -DCMAKE_INSTALL_PREFIX=build/install \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_PIPER_PHONEMIZE_PYTHON=OFF \
            -DBUILD_PIPER_PHONEMIZE_CORE_TESTS=OFF
          cmake --build build -j$(sysctl -n hw.ncpu) --target install

          mkdir -p /tmp/dotnet/osx-arm64
          cp build/install/lib/libpiper_phonemize_core.dylib /tmp/dotnet/osx-arm64/

      - name: Pack NuGet packages
        run: |
          chmod +x scripts/dotnet/run.sh
          ./scripts/dotnet/run.sh

      - name: Run example
        run: |
          cd dotnet-examples/PhonemizeText

          # Use local packages
          dotnet add package com.github.csukuangfj.piper.phonemize \
            --source /tmp/dotnet/packages/ \
            --prerelease

          dotnet run
