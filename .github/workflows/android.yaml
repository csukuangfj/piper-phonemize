name: android

on:
  push:
    branches:
      - jni
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android

      - name: Build JNI for all Android ABIs
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "=== Building for $ABI ==="
            cmake -Bbuild-$ABI \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DBUILD_PIPER_PHONEMIZE_PYTHON=OFF \
              -DBUILD_PIPER_PHONEMIZE_CORE_TESTS=OFF \
              -DBUILD_PIPER_PHONEMIZE_JNI=ON
            cmake --build build-$ABI -j4
          done

      - name: Build AAR with Gradle
        shell: bash
        run: |
          VERSION=$(grep "set(PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | sed 's/.*set(PIPER_PHONEMIZE_VERSION \(.*\))/\1/' | tr -d ' ")')
          echo "VERSION=$VERSION"

          # Copy JNI libs into Gradle project
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p android-aar/piper-phonemize/src/main/jniLibs/$ABI
            cp build-$ABI/lib/libpiper-phonemize-jni.so android-aar/piper-phonemize/src/main/jniLibs/$ABI/
          done

          # Copy espeak-ng-data to assets
          mkdir -p android-aar/piper-phonemize/src/main/assets
          cp -r swift-api-examples/espeak-ng-data android-aar/piper-phonemize/src/main/assets/

          # Build AAR
          cd android-aar
          chmod +x gradlew
          ./gradlew :piper-phonemize:assembleRelease

          # Copy and rename AAR
          cp piper-phonemize/build/outputs/aar/piper-phonemize-release.aar \
             ../piper-phonemize-${VERSION}.aar
          cd ..
          ls -lh piper-phonemize-${VERSION}.aar

      - name: Upload AAR
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: piper-phonemize-*.aar
          tag: v1.4.7
