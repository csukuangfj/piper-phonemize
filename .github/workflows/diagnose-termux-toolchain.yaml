name: diagnose-termux-toolchain

# Temporary diagnostics: figure out why the "termux" Android archives reference
# std::__ndk1 (the NDK libc++ inline namespace) and therefore fail to link in
# Termux with "undefined symbol: std::__ndk1::...".
#
# Run it on demand (workflow_dispatch) and read the job log; everything is
# printed with === section headers.

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: diagnose-termux-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Run diagnostics inside termux/termux-docker:aarch64
        shell: bash
        run: |
          chmod -R 777 "${{ github.workspace }}" || true

          docker run --rm \
            --volume ${{ github.workspace }}/:/work \
            --workdir /work \
            termux/termux-docker:aarch64 \
          bash -c '
            set -ex
            apt update -y
            apt install -y cmake make git clang libc++ curl

            echo "=== 1. compilers ==="
            clang --version
            c++ --version
            uname -a

            echo "=== 2. control: which namespace does the toolchain emit? ==="
            printf "#include <string>\n#include <mutex>\nint f(){std::string s=\"a\"; std::mutex m; m.lock(); m.unlock(); return (int)s.size();}\n" > ./diag-x.cpp
            c++ -c ./diag-x.cpp -o ./diag-x.o
            nm ./diag-x.o | grep -oE "NSt[0-9]+_[A-Za-z0-9_]+" | sort | uniq -c || true

            echo "=== 3. what does the runtime libc++ export? ==="
            ls -l $PREFIX/lib/libc++* || true
            for lib in $PREFIX/lib/libc++.so*; do
              echo "--- $lib"
              nm -D "$lib" | grep -oE "NSt[0-9]+_[A-Za-z0-9_]+" | sort | uniq -c | head || true
            done

            echo "=== 4. build piper-phonemize from source (as the release does) ==="
            BUILD_SHARED_LIBS=OFF bash ./build-termux.sh

            echo "=== 5. namespace of the freshly built archive ==="
            nm -g build-termux/install/lib/libpiper_phonemize_core.a | grep -oE "NSt[0-9]+_[A-Za-z0-9_]+" | sort | uniq -c | head || true

            echo "=== 6. cmake cache + the exact compile line for c-api.cpp ==="
            grep -E "CMAKE_CXX_COMPILER:|CMAKE_CXX_FLAGS:" build-termux/CMakeCache.txt || true
            cmake --build build-termux -- VERBOSE=1 2>&1 | grep -m1 "c-api.cpp" || true

            echo "=== 7. namespace of the PUBLISHED v1.5.3 termux archive ==="
            curl -sSL -o ./diag-pp.tar.bz2 https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.3/piper-phonemize-v1.5.3-android-termux-static-lib.tar.bz2
            mkdir -p ./diag-pp && tar xf ./diag-pp.tar.bz2 -C ./diag-pp
            nm -g ./diag-pp/libs/arm64-v8a/libpiper_phonemize_core.a | grep -oE "NSt[0-9]+_[A-Za-z0-9_]+" | sort | uniq -c | head || true

            echo "=== done ==="
          '
