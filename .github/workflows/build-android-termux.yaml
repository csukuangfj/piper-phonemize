name: build-android-termux

# Builds the Android libraries inside termux/termux-docker instead of with the
# Android NDK.
#
# Why: the NDK toolchain compiles C++ against the NDK libc++ (inline namespace
# std::__ndk1). Termux links its own libc++ (inline namespace std::__1), so the
# NDK-built archives cannot be linked there -- every "std::__ndk1::..." symbol
# is undefined. These builds use Termux's clang/libc++ and therefore work in
# Termux, while the plain -android archives keep serving NDK/app consumers.
#
# The termux-docker images are native binaries per architecture, so each arch
# must run on a matching GitHub runner (an aarch64 image cannot exec on an
# x86_64 runner -- "exec format error").
#
# Archives produced here (same layout as the NDK ones, so piper-phonemize-sys's
# build.rs finds them unchanged):
#   piper-phonemize-v${VERSION}-android-termux.tar.bz2             jniLibs/{abi}/*.so
#   piper-phonemize-v${VERSION}-android-termux-static-lib.tar.bz2  libs/{abi}/*.a

on:
  push:
    branches:
      - fix-rust
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # tag-pattern on pub.dev: 'v{{version}}'
  workflow_dispatch:

concurrency:
  group: build-android-termux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-termux-static:
    name: Build static ${{ matrix.abi }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            abi: arm64-v8a
          - arch: arm
            runner: ubuntu-24.04-arm
            abi: armeabi-v7a
          - arch: x86_64
            runner: ubuntu-latest
            abi: x86_64
          - arch: i686
            runner: ubuntu-latest
            abi: x86
    steps:
      - uses: actions/checkout@v4

      - name: Build with the Termux toolchain
        shell: bash
        run: |
          # Pre-create the staging directory and make the workspace writable
          # on the host: the container cannot create directories (no
          # permissions), and its `rm`/`cp` must be able to write here too.
          mkdir -p libs/${{ matrix.abi }}
          mkdir -p build-termux
          chmod -R 777 "${{ github.workspace }}" || true

          docker run --rm \
            --volume ${{ github.workspace }}/:/work \
            --workdir /work \
            termux/termux-docker:${{ matrix.arch }} \
          bash -c '
            set -ex
            apt update -y
            apt install -y cmake make git clang libc++
            # Invoke with `bash` explicitly: the image has no /usr/bin/env,
            # so the scripts #!/usr/bin/env bash shebang cannot be exec()d.
            BUILD_SHARED_LIBS=OFF bash ./build-termux.sh
          '

          cp -v ./build-termux/install/lib/*.a ./libs/${{ matrix.abi }}/

      - uses: actions/upload-artifact@v4
        with:
          name: piper-termux-static-${{ matrix.abi }}
          path: |
            ./libs
            ./build-termux/install/include

  create-android-termux-static-archive:
    needs: build-android-termux-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: piper-termux-static-*
          path: artifacts

      - name: Merge artifacts
        shell: bash
        run: |
          mkdir -p libs include
          cp -rv artifacts/*/libs/* libs/
          cp -rv artifacts/piper-termux-static-arm64-v8a/build-termux/install/include/. include/

      - name: Create archive
        shell: bash
        run: |
          VERSION=$(grep "set(PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | sed 's/.*set(PIPER_PHONEMIZE_VERSION \(.*\))/\1/' | tr -d ' ")')
          echo "VERSION=$VERSION"

          filename=piper-phonemize-v${VERSION}-android-termux-static-lib.tar.bz2
          tar cjvf $filename ./libs ./include

          ls -lh $filename

      - uses: actions/upload-artifact@v4
        with:
          name: piper-phonemize-android-termux-static-libs
          path: |
            ./libs
            ./include

      - name: Release android termux static libs
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: piper-phonemize-*-android-termux-static-lib.tar.bz2
          tag: v1.5.8

  build-android-termux-shared:
    name: Build shared ${{ matrix.abi }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            abi: arm64-v8a
          - arch: arm
            runner: ubuntu-24.04-arm
            abi: armeabi-v7a
          - arch: x86_64
            runner: ubuntu-latest
            abi: x86_64
          - arch: i686
            runner: ubuntu-latest
            abi: x86
    steps:
      - uses: actions/checkout@v4

      - name: Build with the Termux toolchain
        shell: bash
        run: |
          # Pre-create the staging directory and make the workspace writable
          # on the host: the container cannot create directories (no
          # permissions), and its `rm`/`cp` must be able to write here too.
          mkdir -p jniLibs/${{ matrix.abi }}
          mkdir -p build-termux-shared
          chmod -R 777 "${{ github.workspace }}" || true

          docker run --rm \
            --volume ${{ github.workspace }}/:/work \
            --workdir /work \
            termux/termux-docker:${{ matrix.arch }} \
          bash -c '
            set -ex
            apt update -y
            apt install -y cmake make git clang libc++
            # Invoke with `bash` explicitly: the image has no /usr/bin/env,
            # so the scripts #!/usr/bin/env bash shebang cannot be exec()d.
            BUILD_SHARED_LIBS=ON bash ./build-termux.sh
          '

          cp -v ./build-termux-shared/install/lib/*.so ./jniLibs/${{ matrix.abi }}/

      - uses: actions/upload-artifact@v4
        with:
          name: piper-termux-shared-${{ matrix.abi }}
          path: ./jniLibs

  create-android-termux-shared-archive:
    needs: build-android-termux-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: piper-termux-shared-*
          path: artifacts

      - name: Merge artifacts
        shell: bash
        run: |
          # Note: upload-artifact strips a single top-level directory, so each
          # artifact contains the *contents* of ./jniLibs (i.e. one {abi}/ dir).
          mkdir -p jniLibs
          for d in artifacts/piper-termux-shared-*; do
            cp -rv "$d"/. jniLibs/
          done
          ls -R jniLibs

      - name: Create archive
        shell: bash
        run: |
          VERSION=$(grep "set(PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | sed 's/.*set(PIPER_PHONEMIZE_VERSION \(.*\))/\1/' | tr -d ' ")')
          echo "VERSION=$VERSION"

          filename=piper-phonemize-v${VERSION}-android-termux.tar.bz2
          tar cjvf $filename ./jniLibs

          ls -lh $filename

      - uses: actions/upload-artifact@v4
        with:
          name: piper-phonemize-android-termux-shared-libs
          path: ./jniLibs

      - name: Release android termux shared libs
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: piper-phonemize-*-android-termux.tar.bz2
          tag: v1.5.8
