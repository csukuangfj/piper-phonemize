  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Build WASM module
        shell: bash
        run: |
          ./build-wasm-simd-browser.sh

      - name: Copy WASM assets to the package
        shell: bash
        run: |
          mkdir -p flutter/piper_phonemize/assets/web
          cp -v build-wasm-simd-browser/install/bin/wasm/browser/piper-phonemize-wasm-main.js \
                build-wasm-simd-browser/install/bin/wasm/browser/piper-phonemize-wasm-main.wasm \
                build-wasm-simd-browser/install/bin/wasm/browser/piper-phonemize-wasm-main.data \
                build-wasm-simd-browser/install/bin/wasm/browser/piper-phonemize.js \
                flutter/piper_phonemize/assets/web/

      - name: Use local piper_phonemize
        shell: bash
        run: |
          cd flutter-examples/hello_world
          sed -i.bak 's|  piper_phonemize: \^.*|  # \0\n  piper_phonemize:\n    path: ../../flutter/piper_phonemize|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Copy espeak-ng-data and LICENSE
        shell: bash
        run: |
          cp -r swift-api-examples/espeak-ng-data flutter/piper_phonemize/
          cp LICENSE.md flutter/piper_phonemize/LICENSE

          # Trim asset declarations this build does not use from pubspec.yaml
          # (Flutter requires every declared asset to exist at build time):
          #  - native builds never use the web/WASM bundle → drop assets/web/
          #  - web never reads espeak-ng-data (it is embedded in the WASM .data
          #    package) → drop espeak-ng-data/
          if [ "${{ github.job }}" = "web" ]; then
            sed -i.bak '/espeak-ng-data/d' flutter/piper_phonemize/pubspec.yaml
          else
            sed -i.bak '/- assets\/web\//d' flutter/piper_phonemize/pubspec.yaml
          fi
          rm -f flutter/piper_phonemize/pubspec.yaml.bak

      - name: Build Flutter web app
        shell: bash
        run: |
          cd flutter-examples/hello_world

          flutter pub get
          flutter build web

          ls -lh build/web/

      - name: Zip web app
        shell: bash
        run: |
          cd flutter-examples/hello_world/build/
          mv web flutter-hello-world-web
          zip -r -y flutter-hello-world-web.zip flutter-hello-world-web/
          ls -lh flutter-hello-world-web.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: ./flutter-examples/hello_world/build/flutter-hello-world-web.zip
          tag: flutter

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-hello-world-web
          path: flutter-examples/hello_world/build/flutter-hello-world-web.zip
