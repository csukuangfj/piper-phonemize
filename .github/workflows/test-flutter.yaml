name: test-flutter

on:
  push:
    branches:
      - dart
  workflow_dispatch:

concurrency:
  group: test-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter_local_cocoapods:
    name: flutter-local-cocoapods
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Use local piper_phonemize
        shell: bash
        run: |
          cd flutter-examples/hello_world
          sed -i.bak 's|  piper_phonemize: \^.*|  # \0\n  piper_phonemize:\n    path: ../../flutter/piper_phonemize|' pubspec.yaml
          rm -f pubspec.yaml.bak

      - name: Copy espeak-ng-data and LICENSE
        shell: bash
        run: |
          cp -r swift-api-examples/espeak-ng-data flutter/piper_phonemize/
          cp LICENSE.md flutter/piper_phonemize/LICENSE

          # Trim asset declarations this build does not use from pubspec.yaml
          # (Flutter requires every declared asset to exist at build time):
          #  - native builds never use the web/WASM bundle → drop assets/web/
          #  - web never reads espeak-ng-data (it is embedded in the WASM .data
          #    package) → drop espeak-ng-data/
          if [ "${{ github.job }}" = "web" ]; then
            sed -i.bak '/espeak-ng-data/d' flutter/piper_phonemize/pubspec.yaml
          else
            sed -i.bak '/- assets\/web\//d' flutter/piper_phonemize/pubspec.yaml
          fi
          rm -f flutter/piper_phonemize/pubspec.yaml.bak

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: test-flutter-macos-xcframework

      - name: Build macOS xcframework for Flutter
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-macos-shared-flutter.sh
          unzip -o build-macos-shared-flutter/*.xcframework.zip \
            -d $GITHUB_WORKSPACE/flutter/piper_phonemize/macos/piper_phonemize/

      - name: Disable SPM, use CocoaPods
        run: flutter config --no-enable-swift-package-manager

      - name: flutter pub get
        working-directory: flutter-examples/hello_world
        run: flutter pub get

      - name: pod install
        working-directory: flutter-examples/hello_world/macos
        run: pod install

      - name: flutter build macos
        working-directory: flutter-examples/hello_world
        run: flutter build macos

      - name: Codesign
        shell: bash
        working-directory: flutter-examples/hello_world
        run: |
          codesign --force --deep -s - build/macos/Build/Products/Release/hello_world.app
          xattr -cr build/macos/Build/Products/Release/hello_world.app

      - name: Zip app
        shell: bash
        working-directory: flutter-examples/hello_world
        run: |
          mkdir -p flutter-hello-world-macos-cocoapods
          cp -r build/macos/Build/Products/Release/hello_world.app \
            flutter-hello-world-macos-cocoapods/
          zip -r -y flutter-hello-world-macos-cocoapods.zip flutter-hello-world-macos-cocoapods/

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: ./flutter-examples/hello_world/flutter-hello-world-macos-cocoapods.zip
          tag: flutter

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-hello-world-macos-cocoapods
          path: flutter-examples/hello_world/flutter-hello-world-macos-cocoapods.zip

