name: test-flutter

on:
  push:
    branches:
      - dart
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: test-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter_local:
    name: flutter-local-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fix version
        shell: bash
        run: |
          PIPER_VERSION=$(grep "set(PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | sed 's/.*(\(.*\))/\1/' | tr -d ' ")')
          echo "PIPER_VERSION=$PIPER_VERSION"
          sed -i.bak "s/^version: .*/version: $PIPER_VERSION/" flutter/piper_phonemize/pubspec.yaml
          rm -f flutter/piper_phonemize/pubspec.yaml.bak

      - name: Use local piper_phonemize
        shell: bash
        run: |
          cd flutter-examples/hello_world
          sed -i.bak 's|piper_phonemize:$|piper_phonemize:|' pubspec.yaml
          sed -i.bak 's|    path: ../../flutter/piper_phonemize|    path: ../../flutter/piper_phonemize|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Copy espeak-ng-data and LICENSE
        shell: bash
        run: |
          cp -r swift-api-examples/espeak-ng-data flutter/piper_phonemize/
          cp LICENSE.md flutter/piper_phonemize/LICENSE

      - name: Download native libs
        shell: bash
        run: |
          PIPER_VERSION=v$(grep "set(PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | sed 's/.*(\(.*\))/\1/' | tr -d ' ")')

          if [ "$RUNNER_OS" = "macOS" ]; then
            gh release download xcframework \
              --pattern "piper-phonemize-${PIPER_VERSION}-macos-shared.xcframework.zip" \
              --dir /tmp/libs
            cd /tmp/libs && unzip -o *.zip
            cp -r piper-phonemize.xcframework \
              $GITHUB_WORKSPACE/flutter/piper_phonemize/macos/piper_phonemize/
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
            gh release download $PIPER_VERSION \
              --pattern "piper-phonemize-${PIPER_VERSION}-linux-x64-shared-lib.tar.bz2" \
              --dir /tmp/libs
            cd /tmp/libs && tar xjf *.tar.bz2
            mkdir -p $GITHUB_WORKSPACE/flutter/piper_phonemize/linux/lib/x64
            cp lib/libpiper_phonemize_core.so \
              $GITHUB_WORKSPACE/flutter/piper_phonemize/linux/lib/x64/
          elif [ "$RUNNER_OS" = "Windows" ]; then
            gh release download $PIPER_VERSION \
              --pattern "piper-phonemize-${PIPER_VERSION}-windows-x64-shared-lib.tar.bz2" \
              --dir /tmp/libs
            cd /tmp/libs && tar xjf *.tar.bz2
            mkdir -p $GITHUB_WORKSPACE/flutter/piper_phonemize/windows/lib/x64
            cp bin/piper_phonemize_core.dll \
              $GITHUB_WORKSPACE/flutter/piper_phonemize/windows/lib/x64/
          fi

      - name: flutter pub get
        working-directory: flutter-examples/hello_world
        run: flutter pub get

      - name: flutter build
        working-directory: flutter-examples/hello_world
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            flutter build macos
          elif [ "$RUNNER_OS" = "Linux" ]; then
            flutter build linux
          elif [ "$RUNNER_OS" = "Windows" ]; then
            flutter build windows
          fi

  flutter_published:
    name: flutter-published-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fix version
        shell: bash
        run: |
          PIPER_VERSION=$(grep "set(PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | sed 's/.*(\(.*\))/\1/' | tr -d ' ")')
          echo "PIPER_VERSION=$PIPER_VERSION"
          sed -i.bak "s/^version: .*/version: $PIPER_VERSION/" flutter/piper_phonemize/pubspec.yaml
          rm -f flutter/piper_phonemize/pubspec.yaml.bak

      - name: Use published piper_phonemize
        shell: bash
        run: |
          PIPER_VERSION=$(grep "set(PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | sed 's/.*(\(.*\))/\1/' | tr -d ' ")')
          cd flutter-examples/hello_world
          # Replace path dependency with published version
          sed -i.bak '/piper_phonemize:/,/path:/{/path:/d}' pubspec.yaml
          sed -i.bak "s|piper_phonemize:|piper_phonemize: ^$PIPER_VERSION|" pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: flutter pub get
        working-directory: flutter-examples/hello_world
        run: flutter pub get

      - name: flutter build
        working-directory: flutter-examples/hello_world
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            flutter build macos
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
            flutter build linux
          elif [ "$RUNNER_OS" = "Windows" ]; then
            flutter build windows
          fi
