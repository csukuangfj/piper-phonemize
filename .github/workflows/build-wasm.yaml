name: build-wasm

on:
  push:
    branches:
      - wasm
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # tag-pattern on pub.dev: 'v{{version}}'
  workflow_dispatch:

concurrency:
  group: build-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm-nodejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23

      - name: Build WASM for Node.js
        run: |
          source emsdk/emsdk_env.sh
          bash build-wasm-simd-nodejs.sh

      - name: Display output
        run: |
          ls -lh build-wasm-simd-nodejs/install/bin/wasm/nodejs/

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-nodejs
          path: build-wasm-simd-nodejs/install/bin/wasm/nodejs/


  build-wasm-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23

      - name: Build WASM for browser
        run: |
          source emsdk/emsdk_env.sh
          bash build-wasm-simd-browser.sh

      - name: Display output
        run: |
          ls -lh build-wasm-simd-browser/install/bin/wasm/browser/

      - name: Zip files
        run: |
          PIPER_PHONEMIZE_VERSION=v$(grep "PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | cut -d " " -f 2 | cut -d ")" -f 1)
          cd build-wasm-simd-browser/install/bin/wasm
          zip -r piper-phonemize-${PIPER_PHONEMIZE_VERSION}-wasm-browser.zip browser
          ls -lh piper-phonemize-${PIPER_PHONEMIZE_VERSION}-wasm-browser.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-browser
          path: build-wasm-simd-browser/install/bin/wasm/*.zip

  release:
    name: release
    needs:
      - build-wasm-browser
    runs-on: ubuntu-latest

    steps:
      - name: Download all wasm artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Release wasm
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: false
          file: artifacts/**/piper-phonemize-*-wasm-browser.zip
          tag: wasm
