name: npm-addon-win-arm64

on:
  push:
    branches:
      - node-addon
      - node-win-arm64
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

concurrency:
  group: npm-addon-win-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  npm-addon-win-arm64:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Display node version
        shell: bash
        run: |
          node --version
          node -p "process.arch"

      - name: Build piper-phonemize
        shell: bash
        run: |
          cmake -Bbuild \
            -DCMAKE_INSTALL_PREFIX=build/install \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_PIPER_PHONEMIZE_PYTHON=OFF \
            -DBUILD_PIPER_PHONEMIZE_CORE_TESTS=OFF
          cmake --build build --config Release --target install

      - name: Build piper-phonemize node-addon
        shell: bash
        run: |
          d=$PWD
          export PIPER_PHONEMIZE_INSTALL_DIR=$d/build/install

          cd scripts/node-addon-api

          # Use `npm i` (not `npm install cmake-js@<pinned>`): package.json allows
          # cmake-js ^7.3.0 and only 7.4.0+ recognises Visual Studio 2026, which is
          # what windows-11-arm ships. Pinning 7.3.0 fails with
          # "Could not find any Visual Studio installation to use". Matches
          # sherpa-onnx's npm-addon-win-arm64 workflow.
          npm i

          ./node_modules/.bin/cmake-js compile -A ARM64 --log-level verbose

      - name: Package
        shell: bash
        run: |
          bash .github/scripts/node-addon/run.sh
          cp -fv build/install/lib/piper_phonemize_core* piper-phonemize-win-arm64/ 2>/dev/null || true
          cp -fv build/install/bin/piper_phonemize_core* piper-phonemize-win-arm64/ 2>/dev/null || true
          rm -fv piper-phonemize-win-arm64/*cxx*
          ls -lh piper-phonemize-win-arm64/

      - name: Load the addon
        shell: bash
        run: |
          cd ./piper-phonemize-win-arm64
          node -e "const a = require('./piper-phonemize.node'); console.log(process.arch, a.getVersionStr())"

      - name: Pack
        shell: bash
        run: |
          cd piper-phonemize-win-arm64
          npm pack
          mv *.tgz ../

      - name: Display tgz contents
        shell: bash
        run: |
          ls -lh ./*.tgz
          echo "--- Contents of tgz ---"
          tar tvf ./*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: piper-phonemize-win-arm64
          path: ./*.tgz

      - name: Publish to npm
        shell: bash
        run: |
          cd piper-phonemize-win-arm64
          npm publish --provenance --access public

      - name: Setup tmate session
        if: false
        # if: failure()
        uses: mxschmitt/action-tmate@v3
