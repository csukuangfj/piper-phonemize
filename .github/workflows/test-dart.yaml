name: test-dart

on:
  push:
    branches:
      - dart
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: test-dart-${{ github.ref }}
  cancel-in-progress: true

# Native libs version to download from releases.
env:
  NATIVE_LIBS_VERSION: "v1.4.8"

jobs:
  dart_local:
    name: dart-local-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fix version
        shell: bash
        run: |
          PIPER_VERSION=$(grep "set(PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | awk '{print $2}' | tr -d ')')
          sed -i.bak "s/^version: .*/version: $PIPER_VERSION/" flutter/piper_phonemize/pubspec.yaml
          rm -f flutter/piper_phonemize/pubspec.yaml.bak

      - name: Use local piper_phonemize
        shell: bash
        run: |
          PIPER_VERSION=$(grep "set(PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | awk '{print $2}' | tr -d ')')
          cd dart-api-examples/version
          sed -i.bak "s|  piper_phonemize: ^$PIPER_VERSION|  # piper_phonemize: ^$PIPER_VERSION\n  piper_phonemize:\n    path: ../../flutter/piper_phonemize|" pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Download native shared libs (Linux x64)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ env.NATIVE_LIBS_VERSION }} \
            --pattern "piper-phonemize-${{ env.NATIVE_LIBS_VERSION }}-linux-x64-shared-lib.tar.bz2" \
            --dir /tmp/libs
          cd /tmp/libs && tar xjf *.tar.bz2
          mkdir -p linux/x64
          cp lib/libpiper_phonemize_core.so linux/x64/

      - name: Download native shared libs (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download xcframework \
            --pattern "piper-phonemize-${{ env.NATIVE_LIBS_VERSION }}-macos-shared.xcframework.zip" \
            --dir /tmp/libs
          cd /tmp/libs && unzip *.zip
          mkdir -p macos
          cp -r piper-phonemize.xcframework macos/

      - name: Download native shared libs (Windows x64)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ env.NATIVE_LIBS_VERSION }} \
            --pattern "piper-phonemize-${{ env.NATIVE_LIBS_VERSION }}-windows-x64-shared-lib.tar.bz2" \
            --dir /tmp/libs
          cd /tmp/libs && tar xjf *.tar.bz2
          mkdir -p windows/x64
          cp bin/piper_phonemize_core.dll windows/x64/

      - name: Show downloaded files
        shell: bash
        run: |
          echo "=== /tmp/libs contents ==="
          find /tmp/libs -type f 2>/dev/null | sort
          echo "=== flutter/piper_phonemize native dirs ==="
          find flutter/piper_phonemize/linux flutter/piper_phonemize/windows flutter/piper_phonemize/macos -type f 2>/dev/null | sort

      - name: Place native libs
        shell: bash
        run: |
          if [ -d /tmp/libs/linux ]; then
            cp -r /tmp/libs/linux/ flutter/piper_phonemize/linux/lib/
          fi
          if [ -d /tmp/libs/macos ]; then
            cp -r /tmp/libs/macos/piper-phonemize.xcframework \
              flutter/piper_phonemize/macos/piper_phonemize/
          fi
          if [ -d /tmp/libs/windows ]; then
            cp -r /tmp/libs/windows/ flutter/piper_phonemize/windows/lib/
          fi

      - name: Show placed native libs
        shell: bash
        run: |
          echo "=== flutter/piper_phonemize native dirs after place ==="
          find flutter/piper_phonemize/linux flutter/piper_phonemize/windows flutter/piper_phonemize/macos -type f 2>/dev/null | sort

      - name: flutter pub get
        working-directory: dart-api-examples/version
        run: flutter pub get

      - name: Copy espeak-ng-data (needed for flutter analyze)
        shell: bash
        run: |
          cp -r swift-api-examples/espeak-ng-data flutter/piper_phonemize/
          cp LICENSE.md flutter/piper_phonemize/LICENSE

      - name: flutter analyze
        working-directory: flutter/piper_phonemize
        run: flutter analyze

      - name: Run main_sync.dart
        working-directory: dart-api-examples/version
        run: dart run bin/main_sync.dart

      - name: Run main_async.dart
        working-directory: dart-api-examples/version
        run: dart run bin/main_async.dart

      - name: Run main_isolate_sync.dart
        working-directory: dart-api-examples/version
        run: dart run bin/main_isolate_sync.dart

      - name: Run main_isolate_async.dart
        working-directory: dart-api-examples/version
        run: dart run bin/main_isolate_async.dart

  dart_published:
    name: dart-published-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        working-directory: dart-api-examples/version
        run: flutter pub get

      - name: Show published package contents
        shell: bash
        run: |
          PIPER_VERSION=$(grep "set(PIPER_PHONEMIZE_VERSION" ./CMakeLists.txt | awk '{print $2}' | tr -d ')')
          echo "=== Looking for piper_phonemize $PIPER_VERSION in pub cache ==="
          if [ "$RUNNER_OS" = "Linux" ]; then
            find ~/.pub-cache/hosted/pub.dev/piper_phonemize-$PIPER_VERSION -type f | sort
          elif [ "$RUNNER_OS" = "macOS" ]; then
            find ~/.pub-cache/hosted/pub.dev/piper_phonemize-$PIPER_VERSION -type f | sort
          elif [ "$RUNNER_OS" = "Windows" ]; then
            find "$LOCALAPPDATA/Pub/Cache/hosted/pub.dev/piper_phonemize-$PIPER_VERSION" -type f 2>/dev/null | sort || \
            find "$USERPROFILE/AppData/Local/Pub/Cache/hosted/pub.dev/piper_phonemize-$PIPER_VERSION" -type f 2>/dev/null | sort
          fi

      - name: Run main_sync.dart
        working-directory: dart-api-examples/version
        run: dart run bin/main_sync.dart

      - name: Run main_async.dart
        working-directory: dart-api-examples/version
        run: dart run bin/main_async.dart
