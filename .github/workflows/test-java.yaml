name: test-java

on:
  push:
    branches:
      - master
      - jni
  workflow_dispatch:

concurrency:
  group: test-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-java-api:
    name: test-java-api
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JNI lib and JVM JAR
        run: |
          cmake -Bbuild-jni \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_PIPER_PHONEMIZE_PYTHON=OFF \
            -DBUILD_PIPER_PHONEMIZE_CORE_TESTS=OFF \
            -DBUILD_PIPER_PHONEMIZE_JNI=ON \
            -DCMAKE_INSTALL_PREFIX=build-jni/install
          cmake --build build-jni -j4 --target install

          # Copy espeak-ng-data to resources
          mkdir -p java-api/src/main/resources/piper-phonemize
          cp -r swift-api-examples/espeak-ng-data java-api/src/main/resources/piper-phonemize/

          cd java-api
          mvn package -q

      - name: Test Java example
        run: |
          cd java-api-examples
          # The jar name carries the version from java-api/pom.xml; use a glob
          # so this step does not depend on pom.xml and CMakeLists.txt being
          # bumped in lockstep.
          java \
            -cp "../java-api/target/*" \
            -Dpiper_phonemize.native.path=../build-jni/install/lib \
            PhonemizeText.java

  test-maven-examples:
    name: test-maven
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and run Maven example
        run: |
          cd java-api-examples/maven-examples
          mvn package -q
          # Glob: the jar name carries the pom.xml version, which need not
          # match CMakeLists.txt (see the comment in the test-java-api job).
          java -jar target/piper-phonemize-maven-example-*.jar

  test-gradle-examples:
    name: test-gradle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and run Gradle example
        run: |
          cd java-api-examples/gradle-examples
          chmod +x gradlew
          ./gradlew build
          ./gradlew run

  test-gradle-kts-examples:
    name: test-gradle-kts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and run Gradle KTS example
        run: |
          cd java-api-examples/gradle-kts-examples
          chmod +x gradlew
          ./gradlew build
          ./gradlew run
