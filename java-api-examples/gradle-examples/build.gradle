plugins {
    id 'application'
    id 'java'
}

application {
    mainClass = 'com.github.csukuangfj.piper.phonemize.example.PhonemizeText'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // JVM core API Jar
    implementation 'com.github.csukuangfj.piper-phonemize:piper-phonemize-jvm:v1.4.7'

    // Platform native lib — uncomment ONE for your target platform

    // macOS ARM64 (Apple Silicon)
    implementation 'com.github.csukuangfj.piper-phonemize:piper-phonemize-native-lib-osx-aarch64:v1.4.7'

    // macOS x64 (Intel)
    // implementation 'com.github.csukuangfj.piper-phonemize:piper-phonemize-native-lib-osx-x64:v1.4.7'

    // Linux x64
    // implementation 'com.github.csukuangfj.piper-phonemize:piper-phonemize-native-lib-linux-x64:v1.4.7'

    // Linux ARM64
    // implementation 'com.github.csukuangfj.piper-phonemize:piper-phonemize-native-lib-linux-aarch64:v1.4.7'

    // Windows x64
    // implementation 'com.github.csukuangfj.piper-phonemize:piper-phonemize-native-lib-win-x64:v1.4.7'

    // Windows ARM64
    // implementation 'com.github.csukuangfj.piper-phonemize:piper-phonemize-native-lib-win-arm64:v1.4.7'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': 'com.github.csukuangfj.piper.phonemize.example.PhonemizeText'
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
